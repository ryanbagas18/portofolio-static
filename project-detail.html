<!doctype html>
<html lang="id" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Detail - Portofolio Developer</title>

    <!-- Bootstrap 5.3 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      .hero-section {
        min-height: 80vh;
        display: flex;
        align-items: center;
      }

      .project-card {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .project-card:hover {
        transform: translateY(-5px);
      }

      .screenshot-img {
        width: 100%;
        height: auto;
        border-radius: 8px;
        margin-bottom: 1rem;
      }

      /* Carousel Styles */
      .screenshot-carousel {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 8px;
        background: #000;
      }

      .carousel-track {
        width: 100%;
        height: 100%;
        position: relative;
      }

      .carousel-slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 0.3s ease;
        overflow: hidden;
        pointer-events: none;
      }

      .carousel-slide.active {
        opacity: 1;
        pointer-events: auto;
      }

      .carousel-image-wrapper {
        width: 100%;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        display: block;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.3) rgba(255, 255, 255, 0.1);
      }

      .carousel-image-wrapper img {
        width: 100%;
        height: auto;
        display: block;
      }

      /* Custom scrollbar for the image wrapper */
      .carousel-image-wrapper::-webkit-scrollbar {
        width: 6px;
      }

      .carousel-image-wrapper::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
      }

      .carousel-image-wrapper::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 3px;
      }

      .carousel-image-wrapper::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }

      .carousel-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.5);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease;
        z-index: 10;
      }

      .carousel-nav:hover {
        background: rgba(0, 0, 0, 0.8);
      }

      .carousel-nav.prev {
        left: 10px;
      }

      .carousel-nav.next {
        right: 10px;
      }

      .carousel-nav:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .carousel-title-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
        color: white;
        padding: 20px 15px 15px;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 5;
      }

      .screenshot-carousel:hover .carousel-title-overlay {
        opacity: 1;
      }

      .carousel-title-overlay h6 {
        margin: 0;
        font-weight: 500;
      }

      .carousel-indicators {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 10;
      }

      .carousel-indicator {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        transition: background 0.3s ease;
      }

      .carousel-indicator.active {
        background: white;
      }

      .carousel-indicator:hover {
        background: rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav

    >
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html"
          >&lt;Ryan Bagas P. /&gt;</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html#hero">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#projects">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#skills">Skills</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main>
      <!-- Project Detail Section -->
      <section class="bg-light py-5">
        <div class="container py-5">
          <div class="mb-4">
            <a
              href="index.html#projects"
              class="btn btn-outline-secondary btn-sm"
            >
              <i class="bi bi-arrow-left me-1"></i>Back to Projects
            </a>
          </div>

          <div id="project-content">
            <!-- Content will be dynamically loaded here -->
            <div class="text-center py-5">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer
      id="contact"
      class="py-4 bg-dark border-top border-secondary text-white"
    >
      <div class="container">
        <div class="row g-3 justify-content-between align-items-center">
          <!-- Kolom 1: Connect -->
          <div class="col-md-7 text-center text-md-start">
            <h6
              class="fw-bold text-uppercase tracking-wider text-primary mb-2 small"
            >
              Connect
            </h6>
            <ul
              class="list-unstyled d-flex flex-wrap justify-content-center justify-content-md-start gap-3 mb-0"
            >
              <li>
                <a
                  href="https://linkedin.com/in/ryan-bagas-pratama"
                  target="_blank"
                  class="text-white-50 text-decoration-none hover-white d-inline-flex align-items-center small"
                >
                  <i class="bi bi-linkedin me-1"></i>
                  LinkedIn
                </a>
              </li>
              <li>
                <a
                  href="https://github.com/ryanbagas18"
                  target="_blank"
                  class="text-white-50 text-decoration-none hover-white d-inline-flex align-items-center small"
                >
                  <i class="bi bi-github me-1"></i>

                </a>
              </li>
              <li>
                <a
                  href="https://mail.google.com/mail/?view=cm&fs=1&to=ryanbagaspratama18@gmail.com"
                  target="_blank"
                  class="text-white-50 text-decoration-none hover-white d-inline-flex align-items-center small"
                >
                  <i class="bi bi-envelope-fill me-1"></i>
                  Email
                </a>
              </li>
            </ul>
          </div>

          <!-- Kolom 2: Explore -->
          <div class="col-md-4 text-center text-md-end">
            <h6
              class="fw-bold text-uppercase tracking-wider text-primary mb-2 small"
            >
              Explore
            </h6>
            <ul class="list-unstyled d-flex flex-column gap-1 mb-0">
              <li>
                <a
                  href="index.html#hero"
                  class="text-white-50 text-decoration-none hover-white small"
                >
                  Back to Top <i class="bi bi-arrow-up-short"></i>
                </a>
              </li>
            </ul>
          </div>
        </div>

        <!-- Copyright Line -->
        <div
          class="border-top border-secondary mt-3 pt-3 text-center text-white-50 small"
          style="font-size: 0.8rem"
        >
          &copy; 2026 Ryan Bagas Pratama. All rights reserved.
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/projects-data.js"></script>
    <script>
      // Get project ID from URL parameter
      const urlParams = new URLSearchParams(window.location.search);
      const projectId = urlParams.get("id");

      // Find project in data
      const project = projectsData.find((p) => p.id === projectId);

      const projectContent = document.getElementById("project-content");

      if (project) {
        // Build tech stack badges
        const techStackBadges = project.techStack
          .map(
            (tech) =>
              `<span class="badge bg-primary-subtle text-primary border" style="font-size: 0.75rem">${tech}</span>`,
          )
          .join(" ");

        // Build key features HTML
        const keyFeaturesHtml = project.keyFeatures
          ? project.keyFeatures
              .map(
                (feature) =>
                  `<li class="mb-2"><i class="bi bi-check-circle-fill text-primary me-2"></i>${feature}</li>`,
              )
              .join("")
          : "";

        // Build screenshots HTML
        const screenshotsHtml =
          project.screenshots && project.screenshots.length > 0
            ? `
            <div class="screenshot-carousel" id="screenshotCarousel">
              <div class="carousel-track">
                ${project.screenshots
                  .map((screenshot, index) => {
                    const src =
                      typeof screenshot === "string"
                        ? screenshot
                        : screenshot.src;
                    const title =
                      typeof screenshot === "string" ? "" : screenshot.title;
                    return `
                  <div class="carousel-slide ${index === 0 ? "active" : ""}" data-index="${index}">
                    <div class="carousel-image-wrapper">
                      <img src="${src}" alt="${title || project.title}" />
                    </div>
                  </div>
                `;
                  })
                  .join("")}
              </div>
              ${
                project.screenshots.length > 1
                  ? `
                <button class="carousel-nav prev" id="carouselPrev">
                  <i class="bi bi-chevron-left"></i>
                </button>
                <button class="carousel-nav next" id="carouselNext">
                  <i class="bi bi-chevron-right"></i>
                </button>
                <div class="carousel-indicators">
                  ${project.screenshots
                    .map(
                      (_, index) => `
                    <div class="carousel-indicator ${index === 0 ? "active" : ""}" data-index="${index}"></div>
                  `,
                    )
                    .join("")}
                </div>
              `
                  : ""
              }
              <div class="carousel-title-overlay">
                <h6 id="carouselTitle">${typeof project.screenshots[0] === "string" ? "" : project.screenshots[0].title || ""}</h6>
              </div>
            </div>
          `
            : "";

        // Build links HTML
        let linksHtml = "";
        if (project.links.github) {
          linksHtml += `
            <a href="${project.links.github}" target="_blank" class="btn btn-dark me-2">
              <i class="bi bi-github me-1"></i>GitHub
            </a>
          `;
        }
        if (project.links.liveDemo) {
          linksHtml += `
            <a href="${project.links.liveDemo}" target="_blank" class="btn btn-primary">
              <i class="bi bi-box-arrow-up-right me-1"></i>Live Demo
            </a>
          `;
        }

        projectContent.innerHTML = `
          <div class="row">
            <div class="col-lg-8">
              <h1 class="fw-bold text-dark mb-3">${project.title}</h1>
              <p class="text-primary mb-2">${project.organization}</p>
              <p class="text-muted mb-4">${project.role}</p>

              <p class="lead text-secondary mb-4">${project.description}</p>

              <div class="mb-4 d-flex flex-wrap gap-2">
                ${techStackBadges}
              </div>

              <div class="mb-4">
                ${linksHtml}
              </div>
            </div>

            <div class="col-lg-4">
              <img src="${project.thumbnail}" alt="${project.title}" class="img-fluid rounded shadow-lg w-100" />
            </div>
          </div>

          <hr class="my-5" />

          <div class="row">
            <div class="col-lg-6 mb-4">
              <h3 class="fw-bold text-dark mb-3">Problem Statement</h3>
              <p class="text-secondary">${project.problemStatement}</p>
            </div>

            <div class="col-lg-6 mb-4">
              <h3 class="fw-bold text-dark mb-3">Solution</h3>
              <p class="text-secondary">${project.solution}</p>
            </div>
          </div>

          ${
            keyFeaturesHtml
              ? `
          <hr class="my-5" />

          <div class="mb-4">
            <h3 class="fw-bold text-dark mb-3">Key Features</h3>
            <ul class="text-secondary">
              ${keyFeaturesHtml}
            </ul>
          </div>
          `
              : ""
          }

          <hr class="my-5" />

          <div class="mb-4">
            <h3 class="fw-bold text-dark mb-3">Screenshots</h3>
            <div class="row">
              <div class="col-12">
                ${screenshotsHtml}
              </div>
            </div>
          </div>
        `;

        // Update page title
        document.title = `${project.title} - Portofolio Developer`;

        // Initialize carousel functionality
        if (project.screenshots && project.screenshots.length > 1) {
          setTimeout(() => {
            const carousel = document.getElementById("screenshotCarousel");
            if (!carousel) return;

            const slides = carousel.querySelectorAll(".carousel-slide");
            const indicators = carousel.querySelectorAll(".carousel-indicator");
            const prevBtn = document.getElementById("carouselPrev");
            const nextBtn = document.getElementById("carouselNext");
            const titleOverlay = document.getElementById("carouselTitle");
            let currentIndex = 0;

            function showSlide(index) {
              if (index < 0) index = slides.length - 1;
              if (index >= slides.length) index = 0;

              slides.forEach((slide, i) => {
                slide.classList.toggle("active", i === index);
              });

              indicators.forEach((indicator, i) => {
                indicator.classList.toggle("active", i === index);
              });

              const currentScreenshot = project.screenshots[index];
              titleOverlay.textContent =
                typeof currentScreenshot === "string"
                  ? ""
                  : currentScreenshot.title || "";

              prevBtn.disabled = false;
              nextBtn.disabled = false;

              currentIndex = index;
            }

            prevBtn.addEventListener("click", () => {
              showSlide(currentIndex - 1);
            });

            nextBtn.addEventListener("click", () => {
              showSlide(currentIndex + 1);
            });

            indicators.forEach((indicator, index) => {
              indicator.addEventListener("click", () => {
                showSlide(index);
              });
            });

            document.addEventListener("keydown", (e) => {
              if (e.key === "ArrowLeft") {
                showSlide(currentIndex - 1);
              } else if (e.key === "ArrowRight") {
                showSlide(currentIndex + 1);
              }
            });
          }, 100);
        }
      } else {
        projectContent.innerHTML = `
          <div class="text-center py-5">
            <h2 class="fw-bold text-dark mb-3">Project Not Found</h2>
            <p class="text-secondary mb-4">The project you're looking for doesn't exist.</p>
            <a href="index.html#projects" class="btn btn-primary">
              <i class="bi bi-arrow-left me-1"></i>Back to Projects
            </a>
          </div>
        `;
      }
    </script>
  </body>
</html>
